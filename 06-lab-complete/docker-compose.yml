services:
  agent:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8000
      REDIS_URL: redis://redis:6379/0
      AGENT_API_KEY: ${AGENT_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 10s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
volumes:
  redis-data:
